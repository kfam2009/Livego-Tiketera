# Render Blueprint: New + > Blueprint > elegí este repo.
# Crea la web (Docker) y la base Postgres, y las conecta solas.
# La clave del admin la genera Render: verla en el servicio > Environment > ADMIN_PASSWORD.
# Arranca en plan gratis. Para pasar a pago: en el panel de cada servicio > Settings > Instance Type
# (la base gratis vence a los 30 días: pasala a "Basic" antes).
databases:
  - name: livego-db
    plan: free
    databaseName: livego
    user: livego

services:
  - type: web
    name: livego-ticketera
    runtime: docker
    plan: free
    healthCheckPath: /users/login
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: livego-db
          property: connectionString
      - key: SECURITY_SALT
        generateValue: true
      - key: SECURITY_CIPHER_SEED
        value: "48291736501928374650192837465019"
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: APP_DEBUG
        value: "0"
      # Cloudflare Stream (transmisión protegida desde vMix / OBS)
      - key: CF_ACCOUNT_ID
        sync: false
      - key: CF_API_TOKEN
        sync: false
      - key: CF_CUSTOMER_CODE
        sync: false
      # Mercado Pago (Access Token de prueba o de producción)
      - key: MP_ACCESS_TOKEN
        sync: false
      # Emails con Brevo
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MAIL_FROM_NAME
        value: LiveGo
